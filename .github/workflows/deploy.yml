name: Deploy announcements

on:
  push:
    branches: [main]
    paths:
      - changelog.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Si une vérification échoue, rien n'est déployé et l'ancienne version reste en ligne.
      - name: Validate JSON
        run: |
          F=changelog.json
          fail() { echo "::error file=$F::$1"; exit 1; }

          jq empty "$F" || fail "JSON invalide (erreur de syntaxe)"

          jq -e '(.changelog | type) == "array" and (.announcements | type) == "array"' "$F" >/dev/null \
            || fail "Les clés 'changelog' et 'announcements' doivent exister et être des tableaux"

          # --- changelog ---
          jq -e 'all(.changelog[];
                  (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
                  and (.date | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")))' "$F" >/dev/null \
            || fail "changelog : 'version' (x.y.z) et 'date' (AAAA-MM-JJ) obligatoires"

          jq -e 'all(.changelog[];
                  (.changes | type == "array" and length > 0)
                  and all(.changes[];
                        (.type | IN("new", "improved", "fix"))
                        and (.text | type == "string" and length > 0)))' "$F" >/dev/null \
            || fail "changelog : 'changes' non vide, avec type (new|improved|fix) et text"

          jq -e '([.changelog[].version] | length) == ([.changelog[].version] | unique | length)' "$F" >/dev/null \
            || fail "changelog : version en double"

          # --- announcements ---
          jq -e 'all(.announcements[];
                  (.id | type == "string" and length > 0)
                  and (.title | type == "string" and length > 0)
                  and (.message | type == "string" and length > 0))' "$F" >/dev/null \
            || fail "announcements : 'id', 'title' et 'message' obligatoires"

          jq -e '([.announcements[].id] | length) == ([.announcements[].id] | unique | length)' "$F" >/dev/null \
            || fail "announcements : id en double"

          jq -e 'all(.announcements[];
                  .link == null
                  or ((.link.label | type == "string" and length > 0)
                      and (.link.url | type == "string" and test("^https://"))))' "$F" >/dev/null \
            || fail "announcements : 'link' doit avoir un 'label' et une 'url' qui commence par https://"

      - name: Prepare site
        run: |
          mkdir _site
          cp changelog.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
